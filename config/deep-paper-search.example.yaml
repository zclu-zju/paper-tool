# Deep Paper Search configuration.
# Copy this file to config/deep-paper-search.yaml and edit the fields for a run.

calibration:
  # Initial mode: the user may provide only a goal or seed. The workflow runs a
  # lightweight calibration pass before full search.
  enabled: true
  require_user_confirmation_after_calibration: true
  probe_result_limit_per_source: 10
  max_calibration_sources: 3
  write_candidate_papers: true

execution:
  # TODO mode turns the workflow into a goal-like execution loop.
  # The run may finish only when active TODOs are empty, continuation audit says
  # no new TODO is useful, and stop validation passes.
  todo_mode: false
  max_todo_iterations: 100
  require_completion_verification: true
  require_continuation_audit: true
  allow_agents_to_append_todos: true
  duplicate_todo_policy: "MERGE"
  low_yield_policy: "CONVERT_TO_RESIDUAL_RISK"

todo:
  active_file: "workspace/work/deep-paper-search/todo/active.todo"
  done_file: "workspace/work/deep-paper-search/todo/done.todo"
  state_file: "workspace/work/deep-paper-search/todo/todo_state.json"
  log_file: "workspace/work/deep-paper-search/todo/todo_log.md"

research:
  # Required. A topic, direction, keyword set, seed paper path, title, abstract, or summary.
  direction: ""

  # Optional but recommended when the topic has ambiguous terminology across fields.
  domain_hint: ""

  # Required lower bound. The workflow should not stop before this many core relevant papers
  # are found unless it records STOP_WITH_RISK.
  minimum_core_papers: 30

  # Controls effort and stopping strictness: EXPLORATORY, DEEP_SURVEY,
  # SYSTEMATIC_LIKE, or NEAR_EXHAUSTIVE.
  search_depth: "DEEP_SURVEY"

confirmation_bundle:
  # Filled by the calibration pass, then confirmed or edited by the user.
  interpreted_direction: ""
  interpreted_domain: ""
  candidate_keyword_groups:
    user_terms: []
    observed_paper_terms: []
    aliases: []
    exclusion_terms: []
  candidate_scope:
    in_scope: []
    near_scope: []
    out_of_scope: []
  candidate_examples:
    papers: []
  user_confirmed: false

year_policy:
  # Choose RANGE, RECENT_YEARS, ALL_YEARS, or FOUNDATIONAL_PLUS_RECENT.
  mode: "FOUNDATIONAL_PLUS_RECENT"
  start_year: 2018
  end_year: 2026
  recent_years: 5
  include_foundational: true

artifact_download:
  # Choose NONE, PDF_ONLY, TEX_ONLY, or PDF_AND_TEX.
  paper_artifacts: "NONE"
  target_dir: "workspace/work/deep-paper-search/artifacts/"
  tex_compile_policy: "DOWNLOAD_ONLY"

code:
  # Default for literature research: record code availability but do not clone.
  record_code_availability: true
  clone_repositories: false
  clone_target_dir: "workspace/work/deep-paper-search/code/"

inclusion_policy:
  # Default behavior: the system decides relevance from title, abstract, keywords,
  # available full text, discovered equivalent terms, citation clusters, datasets,
  # benchmarks, and method/task alignment.
  system_managed: true
  include_preprints: true
  include_surveys: true
  include_standards_as_term_signals: true
  user_required_terms: []
  user_excluded_terms: []
  user_required_venues: []
  user_excluded_venues: []

outputs:
  # Primary user-facing output. Users usually do not need to edit this.
  primary_table: "workspace/work/deep-paper-search/final/final_papers.csv"
  excel_table: "workspace/work/deep-paper-search/final/final_papers.xlsx"
  write_excel: true
  summary_language: "zh"
  summary_column_last: true
  write_run_summary: true
  run_summary_path: "workspace/work/deep-paper-search/final/run_summary.md"

  # Compact support reports. These are concise and derived from ledgers.
  write_search_protocol: true
  search_protocol_path: "workspace/work/deep-paper-search/support/search_protocol.md"
  write_coverage_report: true
  coverage_report_path: "workspace/work/deep-paper-search/support/coverage_report.md"
  write_gap_report: true
  gap_report_path: "workspace/work/deep-paper-search/support/gap_report.md"
  write_monitoring_config: false
  monitoring_config_path: "workspace/work/deep-paper-search/support/monitoring_config.yaml"

  # Verbose artifacts are disabled by default to avoid noisy scattered files.
  debug_artifacts: false
  debug_dir: "workspace/work/deep-paper-search/debug/"

ledgers:
  # Required execution observability for subagent mode.
  enabled: true
  run_ledger: "workspace/work/deep-paper-search/ledgers/run_ledger.jsonl"
  stage_ledger_csv: "workspace/work/deep-paper-search/ledgers/stage_ledger.csv"
  stage_ledger_jsonl: "workspace/work/deep-paper-search/ledgers/stage_ledger.jsonl"
  agent_ledger: "workspace/work/deep-paper-search/ledgers/agent_ledger.jsonl"
  query_ledger: "workspace/work/deep-paper-search/ledgers/query_ledger.jsonl"
  artifact_index: "workspace/work/deep-paper-search/ledgers/artifact_index.json"
  failure_ledger: "workspace/work/deep-paper-search/ledgers/failure_ledger.jsonl"

final_table:
  required_columns:
    - paper_id
    - title
    - authors
    - year
    - venue
    - publication_type
    - doi
    - arxiv_id
    - paper_url
    - abstract
    - abstract_source
    - citation_count
    - citation_source
    - code_available
    - code_url
    - code_evidence
    - relevance_label
    - relevance_score
    - reference_value_score
    - idea_relation
    - quality_notes
    - limitations
    - motivation
    - source_query
    - discovery_path
    - summary_zh

budgets:
  max_iterations: 6
  max_runtime_minutes: 180
  max_pdf_downloads: 0
  max_api_calls: 2000
