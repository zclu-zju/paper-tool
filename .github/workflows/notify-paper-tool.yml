name: Notify Paper Tool

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request paper-tool sync
        env:
          PAPER_TOOL_SYNC_TOKEN: ${{ secrets.PAPER_TOOL_SYNC_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$PAPER_TOOL_SYNC_TOKEN" ]; then
            echo "::warning::PAPER_TOOL_SYNC_TOKEN is not set; skip paper-tool sync notification"
            exit 0
          fi

          payload=$(printf '{"event_type":"sync-plugin","client_payload":{"source_repo":"%s","source_sha":"%s"}}' "$SOURCE_REPO" "$SOURCE_SHA")
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAPER_TOOL_SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zcluu/paper-tool/dispatches \
            -d "$payload"
